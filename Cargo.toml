[package]
name = "sector_lm"
version = "0.1.0"
edition = "2021"

[dependencies]
tree-sitter = "0.22"
tree-sitter-python = "0.21"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
sha2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
indicatif = "0.17"
tokenizers = "0.20"

[[bin]]
name = "sector_lm"
path = "src/main.rs"

[[bin]]
name = "sector_eval"
path = "src/bin/sector_eval.rs"

[[bin]]
name = "dump_domains"
path = "src/bin/dump_domains.rs"
